name: 功能建议 / Feature request
description: 想要的功能或改进 / A feature or improvement you want
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 你想做什么 / What are you trying to do
      description: 写作时遇到了什么不方便，希望 NovelKit 怎么帮你 / What gets in your way while writing
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想的做法 / Proposed solution
  - type: textarea
    id: extra
    attributes:
      label: 补充 / Anything else
      description: 参考的软件、截图等 / Similar apps, screenshots, etc.
