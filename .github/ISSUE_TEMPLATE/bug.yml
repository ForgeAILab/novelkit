name: 问题反馈 / Bug report
description: 崩溃、报错、补全或整理结果异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 谢谢反馈！请不要贴出未发表的稿件内容或 API Key。
  - type: input
    id: version
    attributes:
      label: NovelKit 版本
      description: 「应用设置 → 关于」里的版本号，或下载的安装包名
      placeholder: v0.1.0-test.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 系统
      options: [macOS · Apple 芯片, macOS · Intel, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: 使用的模型服务
      options: [内置引擎, Ollama, LM Studio, OpenAI 兼容服务, Anthropic / Gemini, Claude Code / Codex, 没有配置模型, 不确定]
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到了什么，原本期望什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 怎么复现
      placeholder: |
        1. 打开……
        2. 点……
        3. 出现……
  - type: textarea
    id: extra
    attributes:
      label: 截图或报错信息
      description: 可以直接把截图拖进来
